<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Ventas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>📦 Inventario de Ventas</h1>
            <p>Administra tus productos, stock y ventas fácilmente.</p>
        </header>

        <!-- RESUMEN -->
        <section class="cards">

            <div class="card">
                <span>Productos registrados</span>
                <strong id="totalProducts">0</strong>
            </div>

            <div class="card">
                <span>Unidades disponibles</span>
                <strong id="totalStock">0</strong>
            </div>

            <div class="card">
                <span>Total vendido</span>
                <strong id="totalSales">$0</strong>
            </div>

        </section>

        <div class="layout">

            <!-- AGREGAR PRODUCTO -->
            <section class="panel">

                <h2>➕ Agregar producto</h2>

                <form id="productForm">

                    <label for="name">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Ej: Camiseta"
                        required
                    >

                    <label for="price">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="Ej: 25000"
                        min="0"
                        required
                    >

                    <label for="stock">
                        Cantidad en stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        placeholder="Ej: 10"
                        min="0"
                        required
                    >

                    <button type="submit" class="btn-primary">
                        ➕ Agregar al inventario
                    </button>

                </form>

                    <button id="resetBtn" class="btn-reset">
                        🗑️ Restablecer inventario
                    </button>
                </div>

            </section>

            <!-- INVENTARIO -->
            <section class="panel">

                <div class="toolbar">

                    <h2>📋 Inventario</h2>

                    <input
                        type="search"
                        id="search"
                        placeholder="🔎 Buscar producto..."
                    >

                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="productTable">
                        </tbody>

                    </table>

                </div>

                <!-- PRODUCTOS VENDIDOS -->
                <div class="sold-section">

                    <h2>🛒 Productos vendidos</h2>

                    <div id="salesList">
                    </div>

                </div>

            </section>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
